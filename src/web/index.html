<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f0e6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1321" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="说一句话，家里的事就安排好了" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="家庭同步" />
    <meta name="application-name" content="家庭同步" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <title>家庭同步</title>
    <script>
      // The theme before the first paint: the choice in 设置 → 外观 (localStorage fs_theme, see lib/theme.ts, which
      // keeps it current afterwards), else the phone's light/dark setting. index.css keys every colour off data-theme.
      ;(function () {
        var pref = null
        try {
          pref = localStorage.getItem('fs_theme')
        } catch (e) {}
        var dark =
          pref === 'dark' ||
          (pref !== 'light' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        if (pref === 'light' || pref === 'dark') {
          var metas = document.querySelectorAll('meta[name="theme-color"]')
          for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', dark ? '#0d1321' : '#f8f0e6')
        }
      })()
    </script>
    <style>
      /* no white flash before the stylesheet loads */
      html,
      body {
        background: #f8f0e6;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background: #0d1321;
        color-scheme: dark;
      }
      html[data-theme='light'] {
        color-scheme: light;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
